# macOS: the clawd_mac tests and an arm64 RedCrab.app (.dmg, kept as an artifact for a few days) on every push to main
# and every pull request.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: NumPy, Pillow, PyObjC and pytest
        run: python -m pip install -r requirements.txt -r requirements-mac.txt pytest==9.2.0

      - name: Compile
        run: python -m compileall -q clawd.py clawd_hook.py clawd_scale.py clawd_mac

      - name: Tests
        run: python -m pytest clawd_mac/tests -q

  app:
    uses: ./.github/workflows/macos-app.yml
    with:
      version: 0.0.${{ github.run_number }}
      runner: macos-26
      arch: arm64
      retention-days: 7
